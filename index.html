<script>

[325,465,88,.15,'#e0183c','#6e0016',0,0],[200,420,122,.5,'#ffa07a','#d2543a',1,1],
[40,330,58,-.25,'#b79bff','#5a2fb0',1,1],[395,370,58,-.1,'#ff9f1c','#b55a00',1,1],[150,45,55,-.8,'#ff4d9d','#a00050',0,0],[275,50,55,-.8,'#ff3b4e','#a8001a',0,0],
[395,180,58,-.4,'#ffe14a','#d9a000',0,0],[25,130,55,-.5,'#9b5cff','#4a1aa0',0,1],[260,430,60,.35,'#ffcf33','#d98a00',0,1],[140,500,52,.2,'#ffffff','#9ad18a',1,0]
].map((a,i)=>{const x=(a[0]-220)/175,y=(285-a[1])/175+.45,z=a[3];

// ---------- geometry builders ----------
function grid(fn,nu,nv,m){
  const b=V.length/5,mi=MT.push(m)-1;
  for(let j=0;j<=nv;j++)for(let i=0;i<=nu;i++){const u=i/nu,v=-1+2*j/nv,p=fn(u,v);V.push(p[0],p[1],p[2],u,v)}

  for(let j=0;j<nv;j++)for(let i=0;i<nu;i++){const a=id(i,j),c=id(i+1,j),d=id(i,j+1),e=id(i+1,j+1);TI.push(a,c,d,mi,c,e,d,mi)}
}
function tube(pts,rf,m,sides=5){
  const n=pts.length,fr=pts.map((p,k)=>{
    const t=N(A(pts[Math.min(n-1,k+1)],S(pts[Math.max(0,k-1)],-1))),r=Math.abs(t[2])<.9?[0,0,1]:[1,0,0],n1=N(X(t,r));return[n1,X(t,n1)]});

    return A(pts[k],A(S(f[0],Math.cos(a)*r),S(f[1],Math.sin(a)*r)))},n-1,sides,m);
}
const bz=(a,b,c,d,t)=>{const s=1-t;return[0,1,2].map(i=>s*s*s*a[i]+3*s*s*t*b[i]+3*s*t*t*c[i]+t*t*t*d[i])};
function blade(path,wm,m){
  grid((u,v)=>{const p=path(u),q=path(Math.min(1,u+.02)),r=path(Math.max(0,u-.02)),t=N(A(q,S(r,-1))),l=N(X([0,1,0],t)),n=X(t,l),w=wm*Math.pow(Math.sin(PI*Math.pow(Math.max(u,.001),.6)),.9);
    return A(p,A(S(l,w*v),S(n,-.5*w*Math.abs(v))))},9,4,m);
}
function petal(f,k,pass,E,i){const e=ease(clamp((E*1.4-pass*.25-k*.06)/.6));
  const psi=pass?PI/3+k*2*PI/3:k*2*PI/3,phi=lp(1.45,pass?.52:.32,e),
   d=A(S(f.e1,Math.cos(psi)),S(f.e2,Math.sin(psi))),l=A(S(f.e1,-Math.sin(psi)),S(f.e2,Math.cos(psi))),
   t=A(S(d,Math.cos(phi)),S(f.ax,Math.sin(phi))),n=X(t,l),
   L=f.R*(.5+.5*e)*(pass?.92:1)*BS,w=f.R*(.15+.1*e)*(pass?.9:1)*BS;
  grid((u,v)=>{const wd=w*Math.pow(Math.sin(PI*Math.pow(Math.max(u,.001),.68)),.85),
    z=-e*e*.8*L*Math.pow(u,2.2)+.3*wd*(1-u)*v*v-.1*wd*Math.abs(v)+.17*wd*Math.sin(u*15+i*2+k*1.7)*v*v*e,a=L*u,b=wd*v;
    return[f.p[0]+t[0]*a+l[0]*b+n[0]*z,f.p[1]+t[1]*a+l[1]*b+n[1]*z,f.p[2]+t[2]*a+l[2]*b+n[2]*z]},NU,NV,{k:0,c:f.c,e:f.e,m:f.m,s:f.s,g:(1-e)*.82});

function flower(f,i,B){
  const e=ease((B*1.5-i*.045)/.55),er=clamp((B*1.5-i*.045)/.55),sg=ease(clamp(GG*1.5-i*.025));BS=ease(clamp((sg-.8)/.2));

  if(BS>.5&&e>.3){
    const s=(e-.3)/.7,R=f.R;
    for(let k=0;k<6;k++){
      const th=k*PI/3+.5,dir=N(A(S(f.ax,.7),A(S(f.e1,Math.cos(th)*.5),S(f.e2,Math.sin(th)*.5)))),pts=[];
      for(let q=0;q<=4;q++){const t=q/4;pts.push(A(f.p,A(S(dir,R*.62*s*t),S(f.ax,R*.12*s*Math.sin(PI*t)))))}
      tube(pts,()=>.008,{k:2,c:[225,205,130],e:[240,225,160]},3);
      const tip=pts[4],pr=pts[3],ad=N(A(tip,S(pr,-1)));

function build(B,G){GG=G;
  V=[];TI=[];MT=[];
  for(let i=0;i<20;i++){
    const th=i*2.4,r=.04+(i%4)*.01,dir=[Math.cos(th),0,Math.sin(th)],Lf=(1.05+.4*Math.abs(Math.sin(i*3.1)))*ease(clamp((GG-.3-i*.012)/.5))+.001,lift=.45+.5*((i*7)%5)/5;

  }

      tube([c0,A(c0,[.015,.015,.015]),A(c0,[.03,.03,.03])],u=>.03*Math.sin(PI*(u*.8+.1))+.004,{k:2,c:[252,250,246],e:[235,235,235]},4)}}
  {const ps=ease(clamp((GG-.45)/.45));if(ps>.01){
    grid((u,v)=>{const th=PI+(v+1)/2*PI,r=(.08+.72*Math.pow(u,.9))*ps*(1+.06*Math.sin(th*7+u*3)),y=BASE[1]+1.2*u*ps+.05*Math.sin(th*5)*u;
      return[BASE[0]+Math.cos(th)*r,y,Math.sin(th)*r*.7-.05]},8,16,{k:3,c:[255,190,215],e:[255,246,250]});
    const R0=.2*ps,py=BASE[1]+.5*ps,rp=[];for(let q=0;q<=20;q++){const a=q/20*2*PI;rp.push([BASE[0]+Math.cos(a)*R0,py,Math.sin(a)*R0*.8])}
    const RB={k:2,c:[255,60,125],e:[255,150,195]};tube(rp,()=>.032*ps,RB,4);
    const cx=BASE[0],cz=R0*.8+.04;
    for(const sg of[-1,1]){const l2=[];for(let q=0;q<=14;q++){const a=q/14*2*PI;l2.push([cx+sg*(.11+.1*Math.cos(a))*ps,py+(.02+.055*Math.sin(a))*ps,cz])}
      tube(l2,()=>.022*ps,RB,4);
      tube([[cx,py,cz],[cx+sg*.07*ps,py-.2*ps,cz+.03],[cx+sg*.12*ps,py-.4*ps,cz]],()=>.02*ps,RB,4)}}}
  {const ms=ease(clamp((GG-.7)/.3));if(ms>.02){
    const P=[1.0,-1.62,.45],R=.3*ms,BODY={k:2,c:[255,228,196],e:[255,244,222]},DK={k:2,c:[70,45,80],e:[70,45,80]},PK={k:2,c:[255,150,180],e:[255,150,180]};

      sph([P[0]+sg*.62*R,P[1]-.14*R,P[2]+.74*R],.17*R,PK,[1,.7,.4]);
      sph([P[0]+sg*.5*R,P[1]-.88*R,P[2]+.35*R],.22*R,BODY,[1,.55,1.2]);

// ---------- albedo ----------
let AR,AG,AB;
function alb(m,u,v){
  let r,g,b,av=Math.abs(v);
  // Diberi multiplier 1.25 agar warna dasar lebih terang dan cerah
  if(m.k==2){r=lp(m.c[0],m.e[0],u)*1.25;g=lp(m.c[1],m.e[1],u)*1.25;b=lp(m.c[2],m.e[2],u)*1.25}
  else if(m.k==3){r=lp(m.c[0],m.e[0],u)*1.25;g=lp(m.c[1],m.e[1],u)*1.25;b=lp(m.c[2],m.e[2],u)*1.25}
  else if(m.k==1){const t=clamp(av*.8+(1-u)*.15);r=lp(m.e[0],m.c[0],t)*1.25;g=lp(m.e[1],m.c[1],t)*1.25;b=lp(m.e[2],m.c[2],t)*1.25}
  else{
    const t=clamp(u/.5);r=lp(m.e[0],m.c[0],t*t*(3-2*t))*1.25;g=lp(m.e[1],m.c[1],t*t*(3-2*t))*1.25;b=lp(m.e[2],m.c[2],t*t*(3-2*t))*1.25;
    const tp=u*u*u*.3;r=lp(r,255,tp);g=lp(g,255,tp);b=lp(b,255,tp);
    if(m.m&&u>.15){const w=clamp((av-.7)/.3)*.85;r=lp(r,252,w);g=lp(g,246,w);b=lp(b,240,w)}
    if(m.m&&u>.12&&av<.1){r=lp(r,m.e[0]*1.5,.4);g=lp(g,m.e[1]*1.2,.4);b=lp(b,m.e[2]*1.3,.4)}
    // Menghapus faktor penggelap (k) agar bunga terlihat polos, cerah, dan tanpa bintik/shadow gelap
    if(Math.sin(v*14+u*2)>.86||av<.06){r*=1.14;g*=1.14;b*=1.14}
    r=lp(r,GREEN[0],m.g);g=lp(g,GREEN[1],m.g);b=lp(b,GREEN[2],m.g);
  }
  AR=r;AG=g;AB=b;
}
// ---------- render ----------
const LD=N([-.45,.55,.75]);
function raster(B){
  const c=Math.cos(yaw),s=Math.sin(yaw),cp=Math.cos(pit),sp2=Math.sin(pit),F=Math.min(W/3.6,H/4.7)*D*zoom,n=VX.length/5;
  for(let i=0;i<n;i++){
    const sw=Math.max(0,VX[i*5+1]+2),x=VX[i*5]+Math.sin(T*1.2+VX[i*5+1]*1.7)*.022*sw,y=VX[i*5+1]-.17,z=VX[i*5+2]+Math.cos(T*.9+VX[i*5]*1.5)*.012*sw,x1=x*c+z*s,z1=-x*s+z*c,y2=y*cp-z1*sp2,z2=y*sp2+z1*cp,dp=D-z2;
    CX[i]=x1;CY[i]=y2;CZ[i]=z2;SZ[i]=dp;SX[i]=(W/2+F*x1/dp)/cw*SS;SY[i]=(H/2-F*y2/dp)/ch*SS;
  }
  zb.fill(1e9);fz.fill(0);cr.fill(0);cg.fill(0);cb.fill(0);
  for(let q=0;q<TI.length;q+=4){

const PT=[],SPET=[[-2,0],[-1,-1],[0,-1],[1,-1],[-1,0],[0,0],[1,0],[2,0],[-1,1],[0,1],[1,1]];

function parts(c,s,cp,sp2,F){

const HP=['.XX.XX.','XXXXXXX','XXXXXXX','.XXXXX.','..XXX..','...X...'],SP=['..X..','.XXX.','XXXXX','.XXX.','..X..'];

['s',-1.15,2.0,0,.16,0,[255,255,255]],['s',1.45,1.8,0,.12,2,[230,200,255]],['s',-1.4,.2,.2,.12,4,[255,255,255]],['s',1.4,-.3,.2,.14,1,[255,255,255]],['s',0,2.55,0,.14,5,[255,240,200]]];
function decos(c,s,cp,sp2,F){
  const e=clamp((lastB-.45)/.3);if(e<=0)return;

    const pat=d[0]=='h'?HP:SP,wd=pat[0].length,ht=pat.length,y=d[2]+Math.sin(T*1.2+d[5])*.05-.17,z=d[3],x1=d[1]*c+z*s,z1=-d[1]*s+z*c,y2=y*cp-z1*sp2,z2=y*sp2+z1*cp,dp=D-z2;

function resolve(){
  const S=SS;

    let r=0,g=0,b=0,c=0,f=0,zs=0,zmn=1e9,zmx=-1e9;

const DIG='1742356098',RD='0123456789',bst=v=>Math.min(255,(255*Math.pow(v/255,.82))|0),bsf=v=>Math.min(255,(255*Math.pow(v/255,.68)*1.12)|0);
